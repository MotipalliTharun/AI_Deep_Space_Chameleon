[project]
name = "space-chameleon-api"
version = "0.0.1"
description = "AI Space Chameleon API — intent router, RAG, task engine gateway, WebSocket/SSE streaming."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "redis>=5.0.0",
  "pgvector>=0.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "hypothesis>=6.112.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
